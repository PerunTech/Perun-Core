# pnpm 9 reads this file as a workspace definition alone and refuses it without
# a packages list. pnpm 10 and 11, which also read their settings from here,
# accept it either way. Empty is accurate: there are no sub-packages.
packages: []

# monaco-editor, the peer @monaco-editor/react has installed for it, asks for
# dompurify 3.4.8 exactly, which carries open advisories, and monaco has
# published no release that moves off it. This lifts that one copy. Monaco itself
# is loaded from the CDN at runtime and is not in perun-core.js, so this clears
# the audit and protects the dev machine rather than changing what runs.
#
# Moved from npm's `overrides` with the lockfile. Two more went rather than
# moved: qs and uuid, which only webpack-dev-server and webpack's url polyfill
# brought in, and which left the tree with them.
#
# pnpm 11 reads overrides from here; pnpm 9 and 10 read them from the "pnpm"
# field of package.json. Both are declared, and must be kept in step.
overrides:
  monaco-editor>dompurify: '>=3.4.13'

# React 18 under four packages that stopped declaring support at 16. Each still
# runs on 18 through what 18 keeps for them: findDOMNode, the componentWill*
# lifecycles, and ReactDOM.render's legacy root, which client.js renders into.
# React 19 removes the first and the last, so these are the packages that
# block it, and they go with the grid's replacement rather than being lifted
# again (react-input-autosize is react-select 1's own text input).
#
# Allowed by exact name and major, so a further major of React reports them
# again. Declared in both places for the same reason as the overrides above.
peerDependencyRules:
  allowedVersions:
    react-data-grid>react: '18'
    react-data-grid>react-dom: '18'
    react-select>react: '18'
    react-select>react-dom: '18'
    react-input-autosize>react: '18'
    react-select-fast-filter-options>react: '18'
