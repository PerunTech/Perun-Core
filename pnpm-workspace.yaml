# pnpm 9 refuses this file without a packages list; there are no sub-packages.
packages: []

# monaco-editor pins dompurify 3.4.8, which has open advisories. Monaco loads from the CDN at runtime,
# so this only clears the audit. pnpm 9 reads overrides only from package.json.
overrides:
  monaco-editor>dompurify: '>=3.4.13'
  # The rich text editor parses guides with the marked version the Help panel renders them with.
  '@tiptap/markdown>marked': '^18.1.1'
