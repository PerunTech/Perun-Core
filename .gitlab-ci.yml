stages:
  - 1_linter
  - 2_build_and_install
  - 3_mvn_install
  - 4_sonarqube

# No cache entries. Both of the ones this file had are gone with what filled them: .webpack_cache
# with webpack (Vite keeps nothing between builds, and builds the bundle in a few seconds), and the
# npm cache with npm. pnpm's store is not cached in its place: it is several times the size of
# npm's cache unpacked, and a frozen install into an empty store takes seconds, which zipping and
# unzipping the store on the runner's own disk would not beat.

before_script:
  - pwd
  - echo $CI_COMMIT_REF_NAME
  - git remote -v
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_COMMIT_REF_NAME

after_script:
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_COMMIT_REF_NAME

1_npm_install_test_build:
  stage: 1_linter
  script:
    - pwd
    - git reset --hard HEAD
    # The floor is stated once, in package.json's `engines`, and read back here
    # rather than repeated -- the two cannot drift into disagreeing.
    #
    # It is checked rather than merely declared because declaring it is not
    # enough: pnpm only warns when a regular dependency's engines do not match,
    # and says nothing at all when it skips an *optional* one for the same
    # reason. Vite's bundler and oxlint are each built as one optional native
    # binding per platform, so a runner below the floor installs cleanly and then
    # fails with a missing-module trace that names neither node nor the version.
    # This step buys a sentence instead. The runner's node is shared with every
    # other svarog4 project and upgraded by hand.
    - |
      floor=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")
      have=$(node -p "process.versions.node")
      if [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -1)" != "$floor" ]; then
        echo "This runner has node $have; this package needs $floor or newer."
        echo "vite and oxlint declare it, and their native bindings are optional"
        echo "dependencies -- pnpm skips one whose engines do not match without"
        echo "printing anything, so the build would fail a few layers lower down."
        echo "Upgrade node on the runner rather than changing anything here."
        exit 1
      fi
      echo "ok - node $have meets the floor of $floor"
    # `npm ci` emptied node_modules itself; `pnpm install` installs over what is
    # there, so each job clears it first, here and below.
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    # `test` was `eslint --fix frontend/ || exit 0`: it repaired what it could and
    # could never fail a pipeline. There is no test suite here, so the script is
    # gone and lint runs under its own name, and now fails the pipeline on an
    # error. Warnings do not: the react-hooks/exhaustive-deps ones are left
    # standing rather than silenced.
    - pnpm run lint
    - pnpm run build

1_build_test_java:
  cache: []
  stage: 2_build_and_install
  script:
    - mvn clean
    - mvn test
    
1_perun-core-dev-install:
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    - rm -rf www/*.js
    - pnpm run build-dev
    - pwd
    - mvn clean deploy -DskipTests
  only:
    - dev

1_perun-core-dev-generate-js:
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    - rm -rf www/*.js
    - pnpm run build-dev
    - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
    - git remote set-url origin "https://gitlab-ci-token:${K8S_SECRET_GITLABCI_TOKEN}@${url_host}"
    - git remote -v
    - git add www/*.js
    - git commit -m "Auto commit of perun-core library for npm" || exit 0
    - git push origin HEAD:$CI_COMMIT_REF_NAME    
  only:
    - dev
  when: manual

2_perun-core-stable-generate-js:
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    - rm -rf www/*.js
    - pnpm run build
    - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
    - git remote set-url origin "https://gitlab-ci-token:${K8S_SECRET_GITLABCI_TOKEN}@${url_host}"
    - git remote -v
    - git add www/*.js
    - git commit -m "Auto commit of perun-core library for npm" || exit 0
    - git push origin HEAD:$CI_COMMIT_REF_NAME    
  only:
    - main
  when: manual

2_perun-core-stable-install:
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    - rm -rf www/*.js
    - pnpm run build
    - pwd
    - mvn clean deploy -DskipTests
  only:
    - main

1_perun-sonarqube_backend:
  cache: []
  stage: 4_sonarqube
  script:
    - cd $CI_PROJECT_DIR/
    - mvn sonar:sonar -Dsonar.analysis.mode=preview -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHA -Dsonar.gitlab.ref_name=$CI_COMMIT_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
  when: manual

2_perun-sonarqube_backend_publish:
  cache: []
  stage: 4_sonarqube
  script:
    - cd $CI_PROJECT_DIR/
    - mvn sonar:sonar -Dsonar.analysis.mode=publish -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHA -Dsonar.gitlab.ref_name=$CI_COMMIT_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID -Donar.gitlab.user_token access=a18878c7b5beb401ce2f847537c296b46a3902b8 
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - dev  
  when: manual

3_sonarqube_frontend:
  cache: []
  stage: 4_sonarqube
  script:
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=preview -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=publish -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME
  when: manual
